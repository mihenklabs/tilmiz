<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Görsel üretici</title>
<style>
@font-face { font-family: "Amiri"; font-weight: 400; src: url(fonts/amiri-arabic-400-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Amiri"; font-weight: 700; src: url(fonts/amiri-arabic-700-normal.woff2) format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFC; }
@font-face { font-family: "Rubik"; font-weight: 400; src: url(fonts/rubik-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 400; src: url(fonts/rubik-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F; }
@font-face { font-family: "Rubik"; font-weight: 700; src: url(fonts/rubik-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 700; src: url(fonts/rubik-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-024F; }
body { font-family: system-ui; background: #ccc; margin: 16px; }
canvas { margin: 8px; vertical-align: top; box-shadow: 0 1px 4px #0004; }
</style></head>
<body>
<button id="save">Hepsini kaydet</button> <span id="st"></span>
<div id="out"></div>
<script>
const C = { bg: "#1F3A68", ink: "#F4F7FB", saffron: "#D89B1E", line: "rgba(244,247,251,.13)" };
let cfg;

// 8 köşeli yıldız deseni (iç içe iki kare)
function pattern(ctx, w, h, step) {
  ctx.save(); ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.5, step / 40);
  for (let y = step / 2 - step * 0.1; y < h + step; y += step) for (let x = step / 2 - step * 0.1; x < w + step; x += step) {
    const s = step * 0.22;
    ctx.strokeRect(x - s, y - s, 2 * s, 2 * s);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.strokeRect(-s, -s, 2 * s, 2 * s); ctx.restore();
  }
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Noktasız ت gövdesi (ٮ) + iki nokta: biri beyaz, biri safran
function teh(ctx, cx, cy, size) {
  ctx.save();
  ctx.fillStyle = C.ink; ctx.font = `700 ${size}px Amiri`; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  const m = ctx.measureText("ٮ");
  const top = m.actualBoundingBoxAscent, bot = m.actualBoundingBoxDescent;
  // gövdeyi dikeyde ortala (noktalarla birlikte)
  const dotR = size * 0.052, gap = size * 0.07;
  const totalH = top + bot + gap + dotR * 2;
  const base = cy + totalH / 2 - bot;
  ctx.fillText("ٮ", cx, base);
  const dy = base - top - gap - dotR;
  const dx = size * 0.075;
  // nesih noktası gibi hafif yuvarlatılmış eşkenar dörtgen
  const dot = (x, col) => {
    ctx.fillStyle = col; ctx.save(); ctx.translate(x, dy); ctx.rotate(Math.PI / 4);
    roundRect(ctx, -dotR * 0.8, -dotR * 0.8, dotR * 1.6, dotR * 1.6, dotR * 0.35); ctx.fill(); ctx.restore();
  };
  dot(cx + dx, C.ink); dot(cx - dx, C.saffron);
  ctx.restore();
}

function icon(size, { rounded, safe }) {
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  if (rounded) { roundRect(ctx, 0, 0, size, size, size * 0.19); ctx.clip(); }
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, size, size);
  pattern(ctx, size, size, size / 4);
  teh(ctx, size / 2, size / 2, size * (safe ? 0.62 : 0.8));
  return cv;
}

function feature() {
  const w = 1024, h = 500, cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, h);
  pattern(ctx, w, h, 112);
  ctx.fillStyle = C.ink; ctx.textBaseline = "alphabetic";
  ctx.font = "700 96px Rubik"; ctx.fillText(cfg.name, 72, 232);
  ctx.font = "400 36px Rubik"; ctx.globalAlpha = .92;
  ctx.fillText("Arapça kelime, dil bilgisi", 74, 302);
  ctx.fillText("ve okuma pratiği", 74, 352);
  ctx.globalAlpha = 1;
  teh(ctx, 830, 250, 330);
  return cv;
}

async function make() {
  cfg = await (await fetch("app.config.json")).json();
  await Promise.all(["700 100px Amiri", "700 40px Rubik", "400 40px Rubik"].map(f => document.fonts.load(f, "ٮ Tilmiz ğış")));
  const list = {
    "icon-512": icon(512, { rounded: true }),
    "icon-192": icon(192, { rounded: true }),
    "maskable-512": icon(512, { safe: true }),
    "play-icon-512": icon(512, {}),
    "feature-graphic": feature(),
  };
  const out = document.getElementById("out"); out.innerHTML = "";
  for (const [k, cv] of Object.entries(list)) { cv.title = k; out.appendChild(cv); }
  return list;
}
async function saveAll(list) {
  for (const [k, cv] of Object.entries(list)) await fetch("save?name=" + k, { method: "POST", body: cv.toDataURL("image/png") });
  document.getElementById("st").textContent = "kaydedildi";
}
let L;
make().then(l => { L = l; if (location.search.includes("auto=1")) saveAll(L); });
document.getElementById("save").onclick = () => saveAll(L);
</script>
</body></html>
